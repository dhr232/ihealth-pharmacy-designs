name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build, Validate, and Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXT_PUBLIC_SITE_URL: https://ihealthpharmacy.ca

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Prisma Database Migrations
        if: ${{ secrets.DATABASE_URL != '' }}
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Build Next.js Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Deploy to Hostinger via SSH with Persistent Uploads Protection
        if: ${{ secrets.HOSTINGER_SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            set -e

            DEPLOY_PATH="${HOSTINGER_DEPLOY_PATH:-~/public_html}"
            SHARED_UPLOADS="${HOSTINGER_SHARED_PATH:-~/shared/uploads}"

            echo "Ensuring persistent uploads directory exists..."
            mkdir -p "$SHARED_UPLOADS/flyers"
            mkdir -p "$SHARED_UPLOADS/blog"

            echo "Navigating to deployment directory..."
            cd "$DEPLOY_PATH"

            echo "Pulling latest changes from main branch..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing production dependencies..."
            npm ci --omit=dev

            echo "Regenerating Prisma client..."
            npx prisma generate

            if [ -n "${{ secrets.DATABASE_URL }}" ]; then
              echo "Applying database schema migrations..."
              npx prisma migrate deploy
            fi

            echo "Building Next.js application..."
            npm run build

            echo "Protecting and linking persistent uploads..."
            rm -rf "$DEPLOY_PATH/public/uploads"
            ln -sfn "$SHARED_UPLOADS" "$DEPLOY_PATH/public/uploads"

            echo "Restarting Node.js application process..."
            if command -v pm2 > /dev/null; then
              pm2 reload ihealth-pharmacy || pm2 start npm --name "ihealth-pharmacy" -- start
            fi

            echo "Deployment completed successfully."

      - name: Trigger Hostinger Webhook Deploy (Fallback)
        if: ${{ secrets.HOSTINGER_SSH_HOST == '' && secrets.HOSTINGER_WEBHOOK_URL != '' }}
        run: |
          echo "Triggering Hostinger deployment webhook..."
          curl -s -X POST "${{ secrets.HOSTINGER_WEBHOOK_URL }}"

      - name: Notice when Hostinger secrets not configured
        if: ${{ secrets.HOSTINGER_SSH_HOST == '' && secrets.HOSTINGER_WEBHOOK_URL == '' }}
        run: |
          echo "Build and validation succeeded."
          echo "Hostinger automated deployment will run once HOSTINGER_SSH_HOST or HOSTINGER_WEBHOOK_URL is added to repository secrets."
