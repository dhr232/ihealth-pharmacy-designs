name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Lint, type-check, build, and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build static export
        run: npx next build

      - name: Verify static export
        run: |
          test -f out/index.html || (echo "out/index.html missing" && exit 1)
          test -f out/.nojekyll || (echo "out/.nojekyll missing" && exit 1)
          test -d out/_next/static || (echo "_next/static missing" && exit 1)

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke test — host static export
        run: |
          npx http-server out -p 8080 -s &
          SERVER_PID=$!
          sleep 3
          for path in "" "variants/friendly" "variants/friendly/services/minor-ailments"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:8080/$path")
            echo "GET /$path -> $code"
            if [ "$code" != "200" ]; then
              kill $SERVER_PID || true
              echo "Smoke test failed: expected 200, got $code"
              exit 1
            fi
          done
          kill $SERVER_PID || true