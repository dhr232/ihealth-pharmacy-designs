name: ci

# One job, same checks as the local pre-commit rule: lint, tests, typecheck, build.
# Secret scanning and vulnerable-dependency alerts come from GitHub's built-in
# repo features (Settings > Code security), so they are not duplicated here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, test, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run build
