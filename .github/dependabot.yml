version: 2
updates:
  # One grouped PR per month for all npm updates. Security fixes still arrive
  # immediately via GitHub's Dependabot alerts / security updates.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
